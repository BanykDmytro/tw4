<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Witcher 4</title>
</head>
<body>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
        }
        video {
            position: relative;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background: black;
            display: block;
            z-index: 0;
        }
        .hero-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            z-index: 10;                     
        }
        .hero-container h2 {
            color: #fff;
            text-shadow: 0 0 5px #000;
            font-size: 45px;
            margin-bottom: 20px;
        }
        .download {
            padding: 12px 24px;
            border: 2px solid black;
            font-size: 1.6em;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .download:hover {
            background-color: green;
            color: white;
        }
        .about-container {
            position: absolute;
            top: 90%;
            left: 90%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: auto;
            z-index: 10;                     
        }
        .abt {
            padding: 12px 24px;
            border: 2px solid black;
            font-size: 1.6em;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .abt:hover {
            background-color: red;
            color: white;
        }
        @media (max-width: 768px) {
        body {
            overflow: hidden;
            background: black;
        }
        .hero-container h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }
        .about-container {
            left: 50%;
        }
    
        .download {
            font-size: 1.3em;
            padding: 10px 20px;
        }
    
        .abt {
            font-size: 1.3em;
            padding: 10px 20px;
        }
    

}
    </style>

    <section class="header">
        <div class="header-container">
            <video src="video/TW4-trailer.mp4" autoplay muted loop></video>
        </div>
    </section>
    <section class="hero">
        <div class="hero-container">
            <h2>THE WITCHER 4</h2>
            <button class="download">Play for free</button>
        </div>
    </section>
    <section class="about">
        <div class="about-container">
            <a href="second-page/index.html">
            <button class="abt">About</button>
            </a>
        </div>
    </section>
</body>

</html>
