<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Witcher 4</title>
</head>
<body>
    <style> 
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
    }
    .img {
        position: relative;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        background: black;
        display: block;
        z-index: 0;
    }
    .hero-container {
        position: absolute;
        top: 35%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 100%;
        z-index: 10;                     
    }
    .hero-container h2, .hero-container p {
        color: #ffffff;
        text-shadow: 0 0 5px #000;
        font-size: 45px;
        margin-bottom: 20px;
    }
    .about-container {
        position: absolute;
        transform: translate(-50%, -50%);
        top: 85%;
        left: 50%;
        width: 100%;
        text-align: center;
        gap: 20px;
    }
    .tg, .ds {
        padding: 12px 24px;
        font-size: 1.6em;
        border: 2px solid black;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 20px;
        transition: background-color 0.3s ease, color 0.3s ease;
    }
    .tg:hover {
        background-color: rgb(0, 213, 255);
        color: white;
    }
    .ds:hover {
        background-color: rgb(38, 0, 255);
        color: white;
    }
    .main-btn {
        position: absolute;
        transform: translate(-50%, -50%);
        top: 85%;
        left: 90%;
        text-align: center;
        padding: 12px 24px;
        font-size: 1.6em;
        border: 2px solid black;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease, color 0.3s ease;
    }
    .main-btn:hover {
        background-color: red;
        color: white;
    }
    @media (max-width: 768px) {
        .hero-container {
            top: 30%;
            width: 90%;
        }
        
        .hero-container h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }
        
        .hero-container p {
            font-size: 18px;
            line-height: 1.4;
        }
        
        .about-container {
            top: 80%;
        }
        
        .tg, .ds {
            font-size: 1.4em;
            padding: 10px 20px;
            margin: 0 10px;
        }
    }
    
    </style>

    <section class="header">
        <div class="header-container">
            <img class="img" src="img/TW4-png.jpg">
        </div>
    </section>
    <section class="hero">
        <div class="hero-container">
            <h2>Description</h2>
            <p>The Witcher 4 is an action RPG by CD Projekt Red. Explore a dark fantasy world, fight dangerous creatures, complete quests, and make choices that shape the story.
<br><br>
All content and media on this site belong to CD Projekt Red.</p>
        </div>
    </section>
    <section class="about">
        <div class="about-container">
            <button class="tg">Telegramm</button>
            <button class="ds">Discord</button>
        </div>
    </section>
</body>
</html>
